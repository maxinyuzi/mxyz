<!DOCTYPE html>
<!--
  作者：马昕玉子
  建立时间：2026-11-25
  使用大模型：GLM-5.3-Flash
  功能名称：语音识别页（麦克风录音或上传音频 → 七牛 Qwen-Audio-3.0-ASR-Flash 转文字）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音识别 · 马昕玉子的作品集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: "Microsoft YaHei", sans-serif;
      color: #dce6f5;
      display: flex;
      flex-direction: column;
    }
    .mxyz_header { padding: 16px; text-align: center; color: #e94560; }
    .mxyz_header h1 { font-size: 22px; }
    .mxyz_header p { font-size: 12px; color: #8fa3c8; margin-top: 6px; }
    .mxyz_main { flex: 1; padding: 0 16px 16px; }
    .mxyz_card { max-width: 640px; width: 100%; margin: 0 auto; background: #223a5e; border-radius: 16px; padding: 18px; }
    .mxyz_card h2 { font-size: 15px; margin-bottom: 12px; color: #e9a0b0; }

    /* 录音按钮区 */
    .mxyz_record-zone { text-align: center; padding: 14px 0; }
    .mxyz_record-btn {
      width: 92px; height: 92px;
      border-radius: 50%;
      border: none;
      background: #e94560;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(233, 69, 96, 0.4);
    }
    .mxyz_record-btn.mxyz_recording {
      background: #7a1024;
      animation: mxyz_pulse 1.2s infinite;
    }
    @keyframes mxyz_pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.5); }
      50% { box-shadow: 0 0 0 14px rgba(233, 69, 96, 0); }
    }
    .mxyz_record-tip { font-size: 12px; color: #8fa3c8; margin-top: 10px; min-height: 16px; }

    /* 录音回放 */
    .mxyz_audio-play { margin-top: 12px; width: 100%; display: none; }

    /* 分隔线 */
    .mxyz_divider { text-align: center; font-size: 12px; color: #6f89b5; margin: 14px 0; }

    /* 文件上传 */
    .mxyz_upload-area {
      border: 2px dashed #4a6fa5;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      font-size: 13px;
      color: #8fa3c8;
      cursor: pointer;
    }
    .mxyz_upload-area:hover { border-color: #e94560; }
    .mxyz_upload-area input { display: none; }

    /* 转写结果 */
    .mxyz_result {
      margin-top: 14px;
      background: #0f1f3d;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      min-height: 44px;
    }
    .mxyz_result.mxyz_loading { color: #8fa3c8; font-style: italic; }
    .mxyz_result.mxyz_error { color: #ffb3c1; background: #5e2233; }
    .mxyz_model-tag { font-size: 11px; color: #6f89b5; margin-top: 6px; }

    .mxyz_back { display: block; text-align: center; color: #8fa3c8; font-size: 13px; padding: 12px; text-decoration: none; }
    .mxyz_back:hover { color: #e94560; }
  </style>
</head>
<body>
  <header class="mxyz_header">
    <h1>🎙️ 语音识别</h1>
    <p>录音或上传音频 → 七牛 Qwen-Audio-3.0-ASR-Flash 模型转成文字（ai-server 端口 3005 /api/asr）</p>
  </header>

  <div class="mxyz_main">
    <div class="mxyz_card">
      <h2>方式一 · 麦克风录音</h2>
      <div class="mxyz_record-zone">
        <button class="mxyz_record-btn" id="mxyz_recordBtn">🎤<br>开始</button>
        <div class="mxyz_record-tip" id="mxyz_recordTip">点击开始录音</div>
        <audio class="mxyz_audio-play" id="mxyz_audioPlay" controls></audio>
      </div>

      <div class="mxyz_divider">—— 或 ——</div>

      <h2>方式二 · 上传音频文件</h2>
      <label class="mxyz_upload-area" id="mxyz_uploadArea">
        点击选择音频文件<br>支持 wav / mp3 / webm 等（≤10MB）
        <input type="file" id="mxyz_fileInput" accept="audio/*">
      </label>

      <div class="mxyz_result" id="mxyz_result">识别出的文字会显示在这里～</div>
      <div class="mxyz_model-tag" id="mxyz_modelTag"></div>
    </div>
  </div>

  <a class="mxyz_back" href="index.html">← 返回首页</a>

  <script>
    // 识别通用提交：把音频 Blob 传给 /api/asr，展示转写文本
    async function mxyz_submitAudio(blob, filename, mime) {
      const result = document.getElementById('mxyz_result');
      result.textContent = '识别中，请稍候…';
      result.className = 'mxyz_result mxyz_loading';
      try {
        const fd = new FormData();
        // 字段名 audio，与服务器 multer.single('audio') 对应
        fd.append('audio', new Blob([blob], { type: mime }), filename);
        const r = await fetch('http://localhost:3005/api/asr', { method: 'POST', body: fd });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || '识别失败');
        result.textContent = d.text || '（模型未返回文字，可能音频里没有可识别的语音）';
        document.getElementById('mxyz_modelTag').textContent = '模型：' + d.model;
      } catch (e) {
        result.textContent = '出错了：' + e.message;
        result.className = 'mxyz_result mxyz_error';
      }
    }

    // ===== 麦克风录音（MediaRecorder）=====
    let mxyz_mediaRecorder = null;
    let mxyz_chunks = [];
    let mxyz_stream = null;

    // mxyz_startRec：申请麦克风权限并开始录音
    async function mxyz_startRec() {
      try {
        mxyz_stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mxyz_chunks = [];
        // 优先用 webm 容器；浏览器不支持时用默认格式
        const opts = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : {};
        mxyz_mediaRecorder = new MediaRecorder(mxyz_stream, opts);
        mxyz_mediaRecorder.ondataavailable = e => { if (e.data.size) mxyz_chunks.push(e.data); };
        // 停止后合成 Blob，展示回放并自动送识别
        mxyz_mediaRecorder.onstop = () => {
          const blob = new Blob(mxyz_chunks, { type: mxyz_mediaRecorder.mimeType || 'audio/webm' });
          const player = document.getElementById('mxyz_audioPlay');
          player.src = URL.createObjectURL(blob);
          player.style.display = 'block';
          mxyz_stream.getTracks().forEach(t => t.stop()); // 释放麦克风
          mxyz_submitAudio(blob, 'recording.webm', blob.type);
        };
        mxyz_mediaRecorder.start();
        mxyz_setRecordingUI(true);
      } catch (e) {
        document.getElementById('mxyz_recordTip').textContent = '❌ 无法访问麦克风：' + e.message + '（请检查浏览器权限，且需在 localhost 或 HTTPS 下使用）';
      }
    }

    // mxyz_stopRec：停止录音
    function mxyz_stopRec() {
      if (mxyz_mediaRecorder && mxyz_mediaRecorder.state === 'recording') mxyz_mediaRecorder.stop();
      mxyz_setRecordingUI(false);
    }

    // mxyz_setRecordingUI：切换录音中/待机的按钮样式与提示文字
    function mxyz_setRecordingUI(on) {
      const btn = document.getElementById('mxyz_recordBtn');
      btn.classList.toggle('mxyz_recording', on);
      btn.innerHTML = on ? '⏹<br>停止' : '🎤<br>开始';
      document.getElementById('mxyz_recordTip').textContent = on ? '正在录音…再次点击停止' : '点击开始录音';
    }

    // boot：绑定录音按钮与文件上传
    (function mxyz_boot() {
      document.getElementById('mxyz_recordBtn').addEventListener('click', () => {
        if (mxyz_mediaRecorder && mxyz_mediaRecorder.state === 'recording') mxyz_stopRec();
        else mxyz_startRec();
      });
      document.getElementById('mxyz_uploadArea').addEventListener('click', () => document.getElementById('mxyz_fileInput').click());
      document.getElementById('mxyz_fileInput').addEventListener('change', e => {
        const f = e.target.files[0];
        if (f) mxyz_submitAudio(f, f.name, f.type || 'audio/wav');
        e.target.value = '';
      });
    })();
  </script>
</body>
</html>
