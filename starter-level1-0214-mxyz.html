<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生成绩面板 level1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);padding:20px;color:#333}
.wrap{max-width:1200px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 40px #0003}
.header{padding:24px 30px;background:#f8f9fa;border-bottom:1px solid #eee}
.header h1{font-size:22px;margin-bottom:16px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat-card{background:#fff;padding:16px;border-radius:12px;border:1px solid #eee;text-align:center}
.stat-card .label{font-size:13px;color:#888;margin-bottom:4px}
.stat-card .val{font-size:24px;font-weight:bold;color:#222}
.ctrl{padding:20px 30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #eee}
#searchInput{flex:1;min-width:220px;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px}
#sortBtns button{padding:9px 16px;border:none;border-radius:8px;background:#eee;cursor:pointer;margin:0 4px}
#sortBtns button.active{background:#667eea;color:#fff}
.main{padding:24px 30px;display:grid;grid-template-columns:280px 1fr;gap:24px}
.warn-box{background:#fff;border:1px solid #eee;border-radius:12px;padding:16px;align-self:start}
.warn-box h3{margin-bottom:12px;font-size:16px}
.rank-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f3f3f3;font-size:14px}
.rank-row .rk{color:#e53935;font-weight:bold;width:24px}
.rank-row .nm{flex:1}
.rank-row .vl{color:#666}
.empty{color:#999;text-align:center;padding:16px}
.card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.student-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:16px;transition:0.2s}
.student-card:hover{box-shadow:0 4px 16px #0002}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:18px}
.avatar.boy{background:#42a5f5}
.avatar.girl{background:#f06292}
.info-wrap{flex:1}
.name{font-weight:bold;font-size:15px}
.meta{font-size:12px;color:#888}
.rank-badge{background:#667eea;color:#fff;padding:3px 8px;border-radius:99px;font-size:12px}
.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.score-item{text-align:center;padding:6px;background:#f8f9fa;border-radius:6px}
.sbj{font-size:12px;color:#777;margin-bottom:2px}
.val{font-weight:bold;font-size:15px}
.val.fail{color:#e53935}
.val.full{color:#2e7d32}
.ft{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-top:8px}
.foot{padding:16px;text-align:center;color:#999;font-size:13px;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>班级成绩分析面板</h1>
    <div class="stats-row">
      <div class="stat-card">
        <div class="label">总人数</div>
        <div class="val" id="statCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">班级总分</div>
        <div class="val" id="statTotalScore">0</div>
      </div>
      <div class="stat-card">
        <div class="label">整体平均分</div>
        <div class="val" id="statAvgScore">0</div>
      </div>
      <div class="stat-card">
        <div class="label">无不及格及格率</div>
        <div class="val" id="statPassRate">0<span>%</span></div>
      </div>
    </div>
  </div>
  <div class="ctrl">
    <input id="searchInput" placeholder="搜索姓名 / 学号">
    <div id="sortBtns">
      <button data-sort="total" class="active">按总分降序</button>
      <button data-sort="id">按学号升序</button>
    </div>
  </div>
  <div class="main">
    <div class="warn-box">
      <h3>不及格预警</h3>
      <div id="failWarningList"></div>
    </div>
    <div class="card-list" id="studentList"></div>
  </div>
  <div class="foot">高级网页设计 · level1 成绩面板</div>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  const STUDENTS = window.STUDENTS;
  const SUBJECTS = window.SUBJECTS;
  const PASS_LINE = 60;
  const EXCELLENT_AVG = 85;

  // 工具函数
  function scoreClass(v) {
    if (v < PASS_LINE) return "fail";
    if (v >= 100) return "full";
    return "";
  }

  function getTotal(s) {
    return SUBJECTS.reduce((sum, sub) => sum + s[sub.key], 0);
  }

  function getAvg(s) {
    const total = getTotal(s);
    const avg = total / SUBJECTS.length;
    return Math.round(avg * 10) / 10;
  }

  function getFails(s) {
    return SUBJECTS.filter(sub => s[sub.key] < PASS_LINE);
  }

  function firstName(s) {
    return s.name.charAt(0);
  }

  // 渲染统计卡片
  function renderStats(list) {
    const count = list.length;
    const totalScore = list.reduce((sum, stu) => sum + getTotal(stu), 0);
    const totalSubjectCount = count * SUBJECTS.length;
    const avgScore = totalSubjectCount > 0 ? Math.round((totalScore / totalSubjectCount) * 10) / 10 : 0;
    const passCount = list.filter(s => getFails(s).length === 0).length;
    const passRate = count > 0 ? Math.round(passCount / count * 100) : 0;

    document.getElementById("statCount").textContent = count;
    document.getElementById("statTotalScore").textContent = totalScore;
    document.getElementById("statAvgScore").textContent = avgScore;
    document.getElementById("statPassRate").firstChild.textContent = passRate;
  }

  // 渲染学生卡片
  function renderStudentCards(list) {
    const container = document.getElementById("studentList");
    container.innerHTML = "";
    list.forEach((s, index) => {
      const rank = index + 1;
      const card = document.createElement("div");
      card.className = "student-card";
      card.setAttribute("data-id", s.id);

      const hd = document.createElement("div");
      hd.className = "hd";

      const avatar = document.createElement("div");
      avatar.className = "avatar " + (s.gender === "男" ? "boy" : "girl");
      avatar.textContent = firstName(s);

      const infoWrap = document.createElement("div");
      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = s.name;
      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      metaEl.textContent = s.id;
      infoWrap.appendChild(nameEl);
      infoWrap.appendChild(metaEl);

      const rankBadge = document.createElement("div");
      rankBadge.className = "rank-badge";
      rankBadge.textContent = `第${rank}名`;

      hd.appendChild(avatar);
      hd.appendChild(infoWrap);
      hd.appendChild(rankBadge);

      const scoreGrid = document.createElement("div");
      scoreGrid.className = "score-grid";
      SUBJECTS.forEach(sub => {
        const scoreVal = s[sub.key];
        const item = document.createElement("div");
        item.className = "score-item";
        item.innerHTML = `
          <div class="sbj">${sub.abbr}</div>
          <div class="val ${scoreClass(scoreVal)}">${scoreVal}</div>
        `;
        scoreGrid.appendChild(item);
      });

      const ft = document.createElement("div");
      ft.className = "ft";
      ft.innerHTML = `
        <div class="total">总分：${getTotal(s)}</div>
        <div class="avg">均分：${getAvg(s)}</div>
      `;

      card.appendChild(hd);
      card.appendChild(scoreGrid);
      card.appendChild(ft);
      container.appendChild(card);
    });
  }

  // 渲染不及格预警
  function renderFailWarning(list) {
    const box = document.getElementById("failWarningList");
    box.innerHTML = "";
    const failStudents = list.filter(s => getFails(s).length > 0);
    failStudents.sort((a, b) => getFails(b).length - getFails(a).length);

    if (failStudents.length === 0) {
      box.innerHTML = `<div class="empty">全员通过，无预警</div>`;
      return;
    }
    failStudents.forEach(stu => {
      const row = document.createElement("div");
      row.className = "rank-row";
      const failSubs = getFails(stu).map(x => x.name).join("、");
      row.innerHTML = `
        <span class="rk">${getFails(stu).length}</span>
        <span class="nm">${stu.name}（${failSubs}）</span>
        <span class="vl">总分 ${getTotal(stu)}</span>
      `;
      box.appendChild(row);
    });
  }

  // 搜索
  function search(keyword) {
    const kw = keyword.trim().toLowerCase();
    if (!kw) return STUDENTS.slice();
    return STUDENTS.filter(s => {
      return s.name.toLowerCase().includes(kw) || s.id.toLowerCase().includes(kw);
    });
  }

  // 排序
  var currentSort = "total";
  function sortList(list, by) {
    const arr = list.slice();
    if (by === "id") {
      arr.sort((a, b) => a.id > b.id ? 1 : -1);
    } else if (by === "total") {
      arr.sort((a, b) => getTotal(b) - getTotal(a));
    }
    return arr;
  }

  // 刷新
  function refresh() {
    var kw = document.getElementById("searchInput").value;
    var data = sortList(search(kw), currentSort);
    renderStats(data);
    renderStudentCards(data);
    renderFailWarning(data);
  }

  // 事件绑定（已给出，无需修改）
  var timer = null;
  document.getElementById("searchInput").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(refresh, 200);
  });

  document.getElementById("sortBtns").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    currentSort = btn.getAttribute("data-sort");
    this.querySelectorAll("button").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    refresh();
  });

  // 初始化
  refresh();
})();
</script>
</body>
</html>
