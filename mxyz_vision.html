<!DOCTYPE html>
<!--
  作者：马昕玉子
  建立时间：2026-11-25
  使用大模型：GLM-5.3-Flash
  功能名称：图像识别页（上传图片 → 硅基流动 Qwen3-VL 视觉模型返回图片描述）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像识别 · 马昕玉子的作品集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: "Microsoft YaHei", sans-serif;
      color: #dce6f5;
      display: flex;
      flex-direction: column;
    }
    .mxyz_header { padding: 16px; text-align: center; color: #e94560; }
    .mxyz_header h1 { font-size: 22px; }
    .mxyz_header p { font-size: 12px; color: #8fa3c8; margin-top: 6px; }

    /* 主体卡片 */
    .mxyz_card {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      background: #223a5e;
      border-radius: 16px;
      padding: 18px;
    }
    .mxyz_main { flex: 1; padding: 0 16px 16px; display: flex; }

    /* 上传区 */
    .mxyz_upload-area {
      border: 2px dashed #4a6fa5;
      border-radius: 12px;
      padding: 26px 12px;
      text-align: center;
      font-size: 13px;
      color: #8fa3c8;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .mxyz_upload-area:hover { border-color: #e94560; }
    .mxyz_upload-area input { display: none; }

    /* 图片预览 */
    .mxyz_preview-wrap { margin-top: 14px; text-align: center; }
    .mxyz_preview {
      max-width: 100%;
      max-height: 320px;
      border-radius: 12px;
      border: 1px solid #4a6fa5;
    }
    .mxyz_file-name { font-size: 12px; color: #8fa3c8; margin-top: 6px; word-break: break-all; }

    /* 识别按钮 */
    .mxyz_recog-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 22px;
      background: #e94560;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .mxyz_recog-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 描述结果 */
    .mxyz_result {
      margin-top: 14px;
      background: #0f1f3d;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      min-height: 40px;
    }
    .mxyz_result.mxyz_loading { color: #8fa3c8; font-style: italic; }
    .mxyz_result.mxyz_error { color: #ffb3c1; background: #5e2233; }
    .mxyz_model-tag { font-size: 11px; color: #6f89b5; margin-top: 6px; }

    .mxyz_back { display: block; text-align: center; color: #8fa3c8; font-size: 13px; padding: 12px; text-decoration: none; }
    .mxyz_back:hover { color: #e94560; }
  </style>
</head>
<body>
  <header class="mxyz_header">
    <h1>🖼️ 图像识别</h1>
    <p>上传图片 → 硅基流动 Qwen3-VL 视觉模型返回描述（ai-server 端口 3005 /api/vision）</p>
  </header>

  <div class="mxyz_main">
    <div class="mxyz_card">
      <!-- 上传模块：点击选图，选中即预览 -->
      <label class="mxyz_upload-area" id="mxyz_uploadArea">
        点击选择图片<br>支持 jpg / png / gif / webp / bmp（≤10MB）
        <input type="file" id="mxyz_fileInput" accept="image/*">
      </label>

      <!-- 预览区：选中图片后显示 -->
      <div class="mxyz_preview-wrap" id="mxyz_previewWrap" style="display:none">
        <img class="mxyz_preview" id="mxyz_preview" alt="预览">
        <div class="mxyz_file-name" id="mxyz_fileName"></div>
      </div>

      <button class="mxyz_recog-btn" id="mxyz_recogBtn" disabled>开始识别</button>

      <div class="mxyz_result" id="mxyz_result">识别结果会显示在这里～</div>
      <div class="mxyz_model-tag" id="mxyz_modelTag"></div>
    </div>
  </div>

  <a class="mxyz_back" href="index.html">← 返回首页</a>

  <script>
    // 当前选中的图片文件缓存
    let mxyz_currentFile = null;

    // el：按 id 取元素
    function el(id) { return document.getElementById(id); }

    // mxyz_pickFile：用户选中图片 → 预览 + 启用识别按钮
    function mxyz_pickFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      mxyz_currentFile = file;
      // FileReader 生成 objectURL 做本地预览（不走服务器）
      el('mxyz_preview').src = URL.createObjectURL(file);
      el('mxyz_fileName').textContent = file.name + '（' + (file.size / 1024).toFixed(1) + ' KB）';
      el('mxyz_previewWrap').style.display = 'block';
      el('mxyz_recogBtn').disabled = false;
      el('mxyz_result').textContent = '识别结果会显示在这里～';
      el('mxyz_result').className = 'mxyz_result';
    }

    // mxyz_recognize：把图片提交给 /api/vision，展示 AI 描述
    async function mxyz_recognize() {
      if (!mxyz_currentFile) return;
      const result = el('mxyz_result');
      result.textContent = '识别中，请稍候…';
      result.className = 'mxyz_result mxyz_loading';
      el('mxyz_recogBtn').disabled = true;

      try {
        // multipart 提交：字段名 image，与服务器 multer.single('image') 对应
        const fd = new FormData();
        fd.append('image', mxyz_currentFile);
        const r = await fetch('http://localhost:3005/api/vision', { method: 'POST', body: fd });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || '识别失败');
        result.textContent = d.description;
        el('mxyz_modelTag').textContent = '模型：' + d.model;
      } catch (e) {
        result.textContent = '出错了：' + e.message + '（请确认 db 目录已运行 node ai-server.js）';
        result.className = 'mxyz_result mxyz_error';
      } finally {
        el('mxyz_recogBtn').disabled = false;
      }
    }

    // boot：绑定上传与识别事件
    (function mxyz_boot() {
      el('mxyz_uploadArea').addEventListener('click', () => el('mxyz_fileInput').click());
      el('mxyz_fileInput').addEventListener('change', e => {
        if (e.target.files[0]) mxyz_pickFile(e.target.files[0]);
        e.target.value = ''; // 允许重复选同一张图
      });
      el('mxyz_recogBtn').addEventListener('click', mxyz_recognize);
    })();
  </script>
</body>
</html>
